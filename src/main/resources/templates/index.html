<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyMate - 가계부</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .month-selector {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .month-selector form {
            display: inline-block;
        }

        .month-selector input[type="number"] {
            width: 100px;
            padding: 10px;
            margin: 0 10px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 16px;
        }

        .month-selector button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-left: 10px;
        }

        .month-selector button:hover {
            background: #5568d3;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        .summary-card h3 {
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .summary-card .amount {
            font-size: 2em;
            font-weight: bold;
        }

        .summary-card.balance {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .form-container {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #667eea;
            color: white;
            font-weight: bold;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999;
            font-style: italic;
        }

        .memo-container {
            background: #fff3cd;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #ffc107;
        }

        .memo-container textarea {
            min-height: 150px;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 MoneyMate 가계부</h1>

        <!-- 월 선택 -->
        <div class="month-selector">
            <form method="get" action="/">
                <label>년도: <input type="number" name="year" th:value="${year}" min="2000" max="2100" required></label>
                <label>월: <input type="number" name="month" th:value="${month}" min="1" max="12" required></label>
                <button type="submit">조회</button>
            </form>
        </div>

        <!-- 요약 카드 -->
        <div class="summary">
            <div class="summary-card">
                <h3>총 저축</h3>
                <div class="amount" th:text="${#numbers.formatDecimal(totalSaving, 0, 'COMMA', 0, 'POINT')} + '원'">0원</div>
            </div>
            <div class="summary-card">
                <h3>총 지출</h3>
                <div class="amount" th:text="${#numbers.formatDecimal(totalExpense, 0, 'COMMA', 0, 'POINT')} + '원'">0원</div>
            </div>
            <div class="summary-card balance">
                <h3>잔액</h3>
                <div class="amount" th:text="${#numbers.formatDecimal(balance, 0, 'COMMA', 0, 'POINT')} + '원'">0원</div>
            </div>
        </div>

        <!-- 저축 섹션 -->
        <div class="section">
            <h2>💵 저축 내역</h2>
            
            <div class="form-container">
                <form th:action="@{/saving/add}" method="post">
                    <input type="hidden" name="year" th:value="${year}">
                    <input type="hidden" name="month" th:value="${month}">
                    <div class="form-group">
                        <label>금액</label>
                        <input type="number" name="amount" required min="0">
                    </div>
                    <div class="form-group">
                        <label>설명</label>
                        <input type="text" name="description" placeholder="저축 내역 설명">
                    </div>
                    <div class="form-group">
                        <label>날짜</label>
                        <input type="date" name="savedDate" th:value="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}">
                    </div>
                    <button type="submit" class="btn">저축 추가</button>
                </form>
            </div>

            <table th:if="${!savings.isEmpty()}">
                <thead>
                    <tr>
                        <th>날짜</th>
                        <th>금액</th>
                        <th>설명</th>
                        <th>작업</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="saving : ${savings}">
                        <td th:text="${#temporals.format(saving.savedDate, 'yyyy-MM-dd')}"></td>
                        <td th:text="${#numbers.formatDecimal(saving.amount, 0, 'COMMA', 0, 'POINT')} + '원'"></td>
                        <td th:text="${saving.description}"></td>
                        <td>
                            <form th:action="@{/saving/delete/{id}(id=${saving.id})}" method="post" style="display: inline;">
                                <input type="hidden" name="year" th:value="${year}">
                                <input type="hidden" name="month" th:value="${month}">
                                <button type="submit" class="btn btn-danger">삭제</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="empty-message" th:if="${savings.isEmpty()}">
                저축 내역이 없습니다.
            </div>
        </div>

        <!-- 지출 섹션 -->
        <div class="section">
            <h2>💸 지출 내역</h2>
            
            <div class="form-container">
                <form th:action="@{/expense/add}" method="post">
                    <input type="hidden" name="year" th:value="${year}">
                    <input type="hidden" name="month" th:value="${month}">
                    <div class="form-group">
                        <label>금액</label>
                        <input type="number" name="amount" required min="0">
                    </div>
                    <div class="form-group">
                        <label>카테고리</label>
                        <select name="category">
                            <option value="">선택하세요</option>
                            <option value="식비">식비</option>
                            <option value="교통비">교통비</option>
                            <option value="쇼핑">쇼핑</option>
                            <option value="의료">의료</option>
                            <option value="교육">교육</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>설명</label>
                        <input type="text" name="description" placeholder="지출 내역 설명">
                    </div>
                    <div class="form-group">
                        <label>날짜</label>
                        <input type="date" name="expenseDate" th:value="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}">
                    </div>
                    <button type="submit" class="btn">지출 추가</button>
                </form>
            </div>

            <table th:if="${!expenses.isEmpty()}">
                <thead>
                    <tr>
                        <th>날짜</th>
                        <th>금액</th>
                        <th>카테고리</th>
                        <th>설명</th>
                        <th>작업</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="expense : ${expenses}">
                        <td th:text="${#temporals.format(expense.expenseDate, 'yyyy-MM-dd')}"></td>
                        <td th:text="${#numbers.formatDecimal(expense.amount, 0, 'COMMA', 0, 'POINT')} + '원'"></td>
                        <td th:text="${expense.category}"></td>
                        <td th:text="${expense.description}"></td>
                        <td>
                            <form th:action="@{/expense/delete/{id}(id=${expense.id})}" method="post" style="display: inline;">
                                <input type="hidden" name="year" th:value="${year}">
                                <input type="hidden" name="month" th:value="${month}">
                                <button type="submit" class="btn btn-danger">삭제</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="empty-message" th:if="${expenses.isEmpty()}">
                지출 내역이 없습니다.
            </div>
        </div>

        <!-- 메모 섹션 -->
        <div class="section">
            <h2>📝 메모</h2>
            <div class="memo-container">
                <form th:action="@{/memo/save}" method="post">
                    <input type="hidden" name="year" th:value="${year}">
                    <input type="hidden" name="month" th:value="${month}">
                    <div class="form-group">
                        <label>이번 달 메모</label>
                        <textarea name="content" placeholder="이번 달에 대한 메모를 작성하세요..." th:text="${memo?.content}"></textarea>
                    </div>
                    <div class="form-group">
                        <label>날짜</label>
                        <input type="date" name="memoDate" th:value="${memo?.memoDate != null ? #temporals.format(memo.memoDate, 'yyyy-MM-dd') : #temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}">
                    </div>
                    <button type="submit" class="btn">메모 저장</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
